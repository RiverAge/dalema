name: Release Android APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-write-only: false

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Android signing (Optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Configuring keystore from secrets..."
            mkdir -p android/app/keystore
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > android/app/keystore/release.jks
            cat > android/key.properties <<EOF
            storeFile=keystore/release.jks
            storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
            keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
            keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          else
            echo "No keystore secret found, building with standard signing configuration."
          fi

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release

      - name: Collect release files & Generate metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          cp build/app/outputs/flutter-apk/app-release.apk release-files/

          app_version="$(awk '/^version:/{print $2; exit}' pubspec.yaml | tr -d '\r')"
          version_name="${app_version%%+*}"
          version_code="1"
          if [[ "$app_version" == *"+"* ]]; then
            version_code="${app_version#*+}"
          fi

          apk_path="release-files/app-release.apk"
          sha256="$(sha256sum "$apk_path" | awk '{print $1}')"
          file_size="$(stat -c%s "$apk_path")"
          repository="${GITHUB_REPOSITORY}"
          tag_name="${GITHUB_REF_NAME:-v$version_name}"

          # Generate release-body.md with DALEMA_UPDATE_METADATA
          cat > release-body.md <<EOF
          <!-- DALEMA_UPDATE_METADATA
          versionName=${version_name}
          versionCode=${version_code}
          asset.android.apk=app-release.apk
          sha256.android.apk=${sha256}
          size.android.apk=${file_size}
          DALEMA_UPDATE_METADATA -->

          ## 打卡了吗 v${version_name} 更新说明

          EOF

          # Generate update.json with fast proxy mirrors
          python3 - <<PY
          import json

          github_url = f"https://github.com/{repository}/releases/download/{tag_name}/app-release.apk"
          mirrors = [
              f"https://ghfast.top/{github_url}",
              f"https://ghproxy.net/{github_url}",
              f"https://gh-proxy.com/{github_url}",
              github_url,
          ]

          manifest = {
              "schemaVersion": 1,
              "repository": "${repository}",
              "tagName": "${tag_name}",
              "releasePageUrl": f"https://github.com/{repository}/releases/tag/{tag_name}",
              "versionName": "${version_name}",
              "versionCode": int("${version_code}"),
              "changelog": f"打卡了吗 v${version_name} 发布",
              "platforms": {
                  "android": {
                      "packageType": "apk",
                      "assetName": "app-release.apk",
                      "downloadUrl": github_url,
                      "sha256": "${sha256}",
                      "fileSize": int("${file_size}"),
                      "mirrors": mirrors
                  }
              }
          }

          with open("release-files/update.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          body_path: release-body.md
          generate_release_notes: true
