name: Release Android APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-write-only: false

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Android signing (Optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Configuring keystore from secrets..."
            mkdir -p android/app/keystore
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > android/app/keystore/release.jks
            cat > android/key.properties <<EOF
            storeFile=keystore/release.jks
            storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
            keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
            keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          else
            echo "No keystore secret found, building with standard signing configuration."
          fi

      - name: Build release APKs (Split per ABI & Universal)
        shell: bash
        run: |
          set -euo pipefail
          # 1. 构建各架构独立小包（arm64-v8a / armeabi-v7a / x86_64）
          flutter build apk --release --split-per-abi
          # 2. 构建 universal 全架构通用兜底大包
          flutter build apk --release

      - name: Collect release files & Generate metadata
        shell: bash
        env:
          REPO_NAME: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-files
          cp build/app/outputs/flutter-apk/*.apk release-files/

          app_version="$(awk '/^version:/{print $2; exit}' pubspec.yaml | tr -d '\r')"
          version_name="${app_version%%+*}"
          version_code="1"
          if [[ "$app_version" == *"+"* ]]; then
            version_code="${app_version#*+}"
          fi

          export APP_VERSION_NAME="$version_name"
          export APP_VERSION_CODE="$version_code"

          python3 - <<'PY'
          import os
          import json
          import hashlib
          from pathlib import Path

          repository = os.environ["REPO_NAME"]
          tag_name = os.environ.get("TAG_NAME") or ("v" + os.environ["APP_VERSION_NAME"])
          version_name = os.environ["APP_VERSION_NAME"]
          version_code = int(os.environ["APP_VERSION_CODE"])

          apk_dir = Path("release-files")

          def get_file_info(file_path):
              if not file_path.exists():
                  return None, 0
              sha = hashlib.sha256(file_path.read_bytes()).hexdigest()
              size = file_path.stat().st_size
              return sha, size

          def build_mirrors(url):
              return [
                  f"https://ghfast.top/{url}",
                  f"https://ghproxy.net/{url}",
                  f"https://gh-proxy.com/{url}",
                  url,
              ]

          # ABI APKs
          abi_map = {
              "arm64-v8a": "app-arm64-v8a-release.apk",
              "armeabi-v7a": "app-armeabi-v7a-release.apk",
              "x86_64": "app-x86_64-release.apk",
          }
          universal_file = "app-release.apk"

          universal_sha, universal_size = get_file_info(apk_dir / universal_file)
          universal_url = f"https://github.com/{repository}/releases/download/{tag_name}/{universal_file}"

          abis_payload = {}
          metadata_lines = [
              "<!-- DALEMA_UPDATE_METADATA",
              f"versionName={version_name}",
              f"versionCode={version_code}",
              f"asset.android.apk={universal_file}",
              f"sha256.android.apk={universal_sha}",
              f"size.android.apk={universal_size}",
          ]

          for abi, filename in abi_map.items():
              sha, size = get_file_info(apk_dir / filename)
              if sha:
                  url = f"https://github.com/{repository}/releases/download/{tag_name}/{filename}"
                  abis_payload[abi] = {
                      "assetName": filename,
                      "downloadUrl": url,
                      "sha256": sha,
                      "fileSize": size,
                      "mirrors": build_mirrors(url),
                  }
                  metadata_lines.append(f"asset.android.apk.{abi}={filename}")
                  metadata_lines.append(f"sha256.android.apk.{abi}={sha}")
                  metadata_lines.append(f"size.android.apk.{abi}={size}")

          metadata_lines.append("DALEMA_UPDATE_METADATA -->")

          # Write release-body.md
          with open("release-body.md", "w", encoding="utf-8") as f:
              f.write("\n".join(metadata_lines) + f"\n\n## 打卡了吗 v{version_name} 更新说明\n")

          # Write update.json
          manifest = {
              "schemaVersion": 1,
              "repository": repository,
              "tagName": tag_name,
              "releasePageUrl": f"https://github.com/{repository}/releases/tag/{tag_name}",
              "versionName": version_name,
              "versionCode": version_code,
              "changelog": f"打卡了吗 v{version_name} 发布",
              "platforms": {
                  "android": {
                      "packageType": "apk",
                      "assetName": universal_file,
                      "downloadUrl": universal_url,
                      "sha256": universal_sha,
                      "fileSize": universal_size,
                      "mirrors": build_mirrors(universal_url),
                      "abis": abis_payload
                  }
              }
          }

          with open("release-files/update.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          body_path: release-body.md
          generate_release_notes: true
